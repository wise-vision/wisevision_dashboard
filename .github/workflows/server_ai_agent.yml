name: WiseVision MCP Server Tests

on:
  pull_request:
    branches:
      - dev
      - main
      - 'stabilization/**'
  schedule:
    - cron: '0 22 * * *'

jobs:
  test:
    runs-on: wisevision-runner
    container:
      image: ubuntu:22.04
    defaults:
      run:
        working-directory: app/server_ai_agent

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y \
          python3-pip \
          curl
        python3 -m pip install --upgrade pip
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync uv environment with dev dependencies
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --extra dev

    - name: Run tests
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # Clean environment from system packages that might interfere
        unset PYTHONPATH
        unset ROS_DISTRO
        unset AMENT_PREFIX_PATH
        export PYTHONNOUSERSITE=1
        # Run tests using uv
        uv run pytest tests/ -v