name: Grafana CI

on:
  pull_request:
    branches:
      - main
      - dev
      - 'stabilization/**'
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: wisevision-runner
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
