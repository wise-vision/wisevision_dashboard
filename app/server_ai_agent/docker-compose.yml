services:
  backend_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wisevision-backend-agent
    restart: unless-stopped
    network_mode: host
    environment:
      # Bridge configuration
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8089
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://172.16.14.133:3000,*
      
      # OpenAI API Key - set this in your .env file or override here
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Development mode
      - DEV=0
    env_file:
      - .env
    volumes:
      # Mount source code for development (optional - remove for production)
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      # Mount logs directory
      - ./logs:/app/logs
      # Mount Docker socket to enable Docker-in-Docker for MCP ROS2 server
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount /dev/shm for ROS2 shared memory
      - /dev/shm:/dev/shm
    # Remove networks section when using host networking
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"  # Disable Traefik if you're using it
      - "com.wisevision.service=backend-agent"
      - "com.wisevision.description=AI Agent Backend Service"

networks:
  wisevision-network:
    driver: bridge
    name: wisevision-network

volumes:
  agent-logs:
    driver: local