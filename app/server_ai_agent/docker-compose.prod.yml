services:
  backend_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wisevision-backend-agent-prod
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      # Bridge configuration
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8089
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://172.16.14.133:3000}
      
      # OpenAI API Key - MUST be set in .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Production mode
      - DEV=0
    env_file:
      - .env
    volumes:
      # Only mount logs in production
      - agent-logs:/app/logs
    networks:
      - wisevision-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.wisevision.service=backend-agent"
      - "com.wisevision.description=AI Agent Backend Service - Production"
      - "com.wisevision.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  wisevision-network:
    driver: bridge
    name: wisevision-network

volumes:
  agent-logs:
    driver: local