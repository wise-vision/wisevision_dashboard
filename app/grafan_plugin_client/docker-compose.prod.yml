services:
  grafana:
    container_name: wisevision-wiseos-app
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=wisevision-wiseos-app
      - GF_LOG_LEVEL=debug
      - GF_LOG_MODE=console

