version: '3.8'

services:
  # Frontend - Next.js Dashboard UI
  frontend:
    build:
      context: ./app/next-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - wisevision-network

  # Backend - FastAPI Service (for standalone use)
  backend-standalone:
    build:
      context: ./app/server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-wisevision-dashboard-dev-key}
      - DATA_BLACK_BOX_URL=http://data-black-box:8001
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - wisevision-network
    depends_on:
      - data-black-box

  # Backend - FastAPI Service (for composite use)
  # This version can be extended by the root compose file
  backend:
    build:
      context: ./app/server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-wisevision-dashboard-dev-key}
      - DATA_BLACK_BOX_URL=http://wisevision_data_black_box:8001
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./logs:/app/logs
    restart: unless-stopped
    # No depends_on here so it can be extended

  # Frontend - Next.js Dashboard UI (for composite use)
  # This version can be extended by the root compose file
  client:
    build:
      context: ./app/next-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    # No depends_on here so it can be extended

